<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>(+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dt=s=>s?s.split("-").reverse().join("/"):"—";
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const MES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const ST=["Novo contato","Interessado","Em negociação","Aguardando resposta","Aguardando pagamento","Contrato fechado","Em desenvolvimento","Aguardando aprovação","Entregue","Pós-venda","Não fechado"];
const ETAPAS=["Briefing","Planejamento","Design","Desenvolvimento","Revisão","Aprovação do cliente","Publicação","Entrega final"];
const CATS=["Hospedagem","Domínio","Ferramentas e softwares","Marketing","Publicidade","Equipamentos","Comissões","Outros gastos"];
const FORMAS=["Pix","Cartão","Boleto","Transferência","Dinheiro","Outro"];
const TIPOS=["Reunião inicial","Apresentação de proposta","Reunião de alinhamento","Revisão do site","Entrega do projeto","Suporte","Pós-venda"];
const AST=["Agendado","Confirmado","Concluído","Reagendado","Cancelado"];
const ATIVOS=["Contrato fechado","Em desenvolvimento","Aguardando aprovação","Aguardando pagamento","Pós-venda"],ESPERA=["Novo contato","Interessado","Em negociação","Aguardando resposta"];
/* schemas: k=campo l=rótulo t=tipo o=opções r=obrigatório w=largura total d=padrão */
const SC={
clients:{n:"Cliente",f:[{k:"empresa",l:"Empresa",r:1},{k:"resp",l:"Responsável"},{k:"tel",l:"Telefone"},{k:"whats",l:"WhatsApp"},{k:"insta",l:"Instagram"},{k:"email",l:"E-mail",t:"email"},{k:"cidade",l:"Cidade"},{k:"cadastro",l:"Data de cadastro",t:"date",d:"hoje"},{k:"servico",l:"Serviço contratado"},{k:"valor",l:"Valor do contrato (R$)",t:"number"},{k:"origem",l:"Origem do cliente"},{k:"status",l:"Status",t:"select",o:ST,d:ST[0]},{k:"responsavel",l:"Atendente (sócio)"},{k:"obs",l:"Observações",t:"textarea",w:1},{k:"hist",l:"Histórico de conversas e atendimentos",t:"textarea",w:1}]},
revenues:{n:"Receita",f:[{k:"cliente",l:"Cliente",r:1},{k:"servico",l:"Serviço vendido",r:1},{k:"valor",l:"Valor total (R$)",t:"number",r:1},{k:"venda",l:"Data da venda",t:"date",r:1,d:"hoje"},{k:"prevista",l:"Pagamento previsto",t:"date"},{k:"forma",l:"Forma de pagamento",t:"select",o:FORMAS},{k:"taxa",l:"Taxas (R$)",t:"number"},{k:"cancelado",l:"Cancelada?",t:"select",o:["Não","Sim"],d:"Não"},{k:"obs",l:"Observações",t:"textarea",w:1}]},
expenses:{n:"Despesa",f:[{k:"nome",l:"Despesa",r:1},{k:"categoria",l:"Categoria",t:"select",o:CATS},{k:"valor",l:"Valor (R$)",t:"number",r:1},{k:"data",l:"Data",t:"date",r:1,d:"hoje"},{k:"forma",l:"Forma de pagamento",t:"select",o:FORMAS},{k:"resp",l:"Responsável pelo gasto"},{k:"tipo",l:"Tipo de custo",t:"select",o:["Operacional","Direto do serviço"],d:"Operacional"},{k:"pago",l:"Situação",t:"select",o:["Pago","Pendente"],d:"Pago"},{k:"recorrente",l:"Recorrência",t:"select",o:["Não","Mensal"],d:"Não"},{k:"nota",l:"Nota — onde foi o gasto",w:1},{k:"desc",l:"Descrição",t:"textarea",w:1}]},
projects:{n:"Projeto",f:[{k:"nome",l:"Nome do projeto",r:1},{k:"cliente",l:"Cliente"},{k:"valor",l:"Valor contratado (R$)",t:"number"},{k:"inicio",l:"Início",t:"date"},{k:"prazo",l:"Prazo de entrega",t:"date"},{k:"resp",l:"Responsáveis (nomes)"},{k:"link",l:"Link do site",t:"url"},{k:"etapa",l:"Etapa atual",t:"select",o:ETAPAS,d:ETAPAS[0]},{k:"obs",l:"Observações",t:"textarea",w:1}]},
appts:{n:"Atendimento",f:[{k:"cliente",l:"Cliente",r:1},{k:"data",l:"Data",t:"date",r:1,d:"hoje"},{k:"hora",l:"Horário",t:"time",r:1},{k:"resp",l:"Responsável"},{k:"tipo",l:"Tipo",t:"select",o:TIPOS},{k:"status",l:"Status",t:"select",o:AST,d:AST[0]},{k:"desc",l:"Descrição",t:"textarea",w:1}]},
members:{n:"Membro",f:[{k:"nome",l:"Nome",r:1},{k:"cargo",l:"Cargo"},{k:"email",l:"E-mail",t:"email"},{k:"pct",l:"Participação nos lucros (%)",t:"number"},{k:"perm",l:"Permissão",t:"select",o:["Administrador","Membro da equipe"],d:"Membro da equipe"},{k:"resp",l:"Responsabilidades",t:"textarea",w:1}]},
sites:{n:"Site criado",f:[{k:"nome",l:"Nome do site",r:1},{k:"cliente",l:"Cliente"},{k:"link",l:"Link do site",t:"url",r:1},{k:"data",l:"Data de publicação",t:"date",d:"hoje"},{k:"obs",l:"Observações",t:"textarea",w:1}]}};
const S={clients:[],revenues:[],expenses:[],projects:[],appts:[],members:[],sites:[],log:[],cfg:{reserva:0}},R={};
let UN=false;
let ADM=false;let db=null,who="Membro",V=(()=>{try{return localStorage.getItem("brs_v")||"dash"}catch{return"dash"}})(),CV="tab",FV="rec",Q="",P={k:"mes",a:"",b:""},ST_F="";
/* ---------- util UI ---------- */
function toast(m,e){const d=document.createElement("div");d.textContent=m;if(e)d.className="e";$("#ts").append(d);setTimeout(()=>d.remove(),3500)}
function ask(msg){return new Promise(ok=>{const d=$("#dg");d.innerHTML=`<h2>${esc(msg)}</h2><div class="fa"><button class="bt o" value="0">Cancelar</button><button class="bt d o" value="1">Excluir</button></div>`;d.onclick=e=>{const b=e.target.closest("button");if(b){d.close();ok(b.value==="1")}};d.oncancel=()=>ok(false);d.showModal()})}

async function log(){}
async function save(c,id,data){try{const r=col(c).doc(id||undefined);id?await r.update(data):await r.set(data);return 1}catch(e){toast("Erro ao salvar: "+(e.message||e.code),1)}}
async function del(c,id,label){if(!await ask(`Excluir ${label}? Esta ação não pode ser desfeita.`))return;try{await col(c).doc(id).delete();toast("Registro excluído");if(c==="revenues"||c==="expenses")log("Exclusão",`${SC[c].n}: ${label}`)}catch(e){toast("Erro ao excluir: "+(e.message||e.code),1)}}
function form(c,id,pre={}){
 const sc=SC[c],cur=id?S[c].find(x=>x.id===id):{...pre};
 const f=sc.f.map(x=>{const v=cur[x.k]??(x.d==="hoje"?today():x.d??"");const a=`name="${x.k}" ${x.r?"required":""}`;let i;
  if(x.t==="select")i=`<select class="sel" ${a}>${x.o.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(x.t==="textarea")i=`<textarea class="in" rows="2" ${a}>${esc(v)}</textarea>`;
  else i=`<input class="in" type="${x.t||"text"}" ${x.t==="number"?'step="0.01" min="0"':""} value="${esc(v)}" ${a}>`;
  return `<label class="${x.w?"w":""}">${esc(x.l)}${x.r?" *":""}${i}<span class="er"></span></label>`}).join("");
 const d=$("#dg");d.innerHTML=`<h2>${id?"Editar":"Novo(a)"} ${sc.n.toLowerCase()}</h2><form class="fm" novalidate>${f}<div class="fa w"><button type="button" class="bt o" data-x>Cancelar</button><button class="bt">Salvar</button></div></form>`;
 d.onclick=null;$("[data-x]",d).onclick=()=>d.close();
 $("form",d).onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),o={};let bad=0;
  sc.f.forEach(x=>{let v=fd.get(x.k).trim();const er=$(`[name=${x.k}]`,d).parentElement.querySelector(".er");er.textContent="";
   if(x.r&&!v){er.textContent="Obrigatório";bad=1}
   if(x.t==="number"){if(v&&(isNaN(+v)||+v<0)){er.textContent="Valor inválido";bad=1}v=v?+v:0;if(x.r&&!v){er.textContent="Informe um valor maior que zero";bad=1}}
   if(x.t==="email"&&v&&!/^\S+@\S+\.\S+$/.test(v)){er.textContent="E-mail inválido";bad=1}
   if(x.t==="url"&&v&&!/^https?:\/\//.test(v)){er.textContent="Use http(s)://";bad=1}
   o[x.k]=v});
  if(bad)return;if(c==="revenues"&&!id)o.payments=[];
  if(await save(c,id,o)){d.close();toast("Salvo com sucesso");if(c==="revenues"||c==="expenses")log(id?"Edição":"Criação",`${sc.n}: ${o.cliente||o.nome} — ${brl(o.valor)}`)}};
 d.showModal()}
function payForm(id){const r=S.revenues.find(x=>x.id===id),falta=r.valor-sum(r.payments||[],p=>p.v),d=$("#dg");
 d.innerHTML=`<h2>Registrar pagamento — ${esc(r.cliente)}</h2><p class="sub">Falta receber ${brl(falta)}</p><form class="fm" style="margin-top:14px"><label>Valor recebido (R$)<input class="in" name="v" type="number" step="0.01" min="0.01" max="${falta}" value="${falta}" required></label><label>Data do recebimento<input class="in" name="d" type="date" value="${today()}" required></label><div class="fa w"><button type="button" class="bt o" data-x>Cancelar</button><button class="bt">Registrar</button></div></form>`;
 $("[data-x]",d).onclick=()=>d.close();d.onclick=null;
 $("form",d).onsubmit=async e=>{e.preventDefault();const v=+e.target.v.value;if(!(v>0)||v>falta+.001)return toast("Valor inválido ou maior que o saldo",1);
  if(await save("revenues",id,{payments:[...(r.payments||[]),{v,d:e.target.d.value}]})){d.close();toast("Pagamento registrado");log("Pagamento",`${r.cliente}: ${brl(v)}`)}};d.showModal()}
/* ---------- período e métricas ---------- */
function range(){const n=new Date(),t=today();let a=t,b=t;
 if(P.k==="sem"){const d=new Date(n);d.setDate(n.getDate()-((n.getDay()+6)%7));a=iso(d);const e=new Date(d);e.setDate(d.getDate()+6);b=iso(e)}
 if(P.k==="mes"){a=iso(new Date(n.getFullYear(),n.getMonth(),1));b=iso(new Date(n.getFullYear(),n.getMonth()+1,0))}
 if(P.k==="ano"){a=n.getFullYear()+"-01-01";b=n.getFullYear()+"-12-31"}
 if(P.k==="per"){a=P.a||"0000-01-01";b=P.b||"9999-12-31"}return[a,b]}
const inR=(d,[a,b])=>d&&d>=a&&d<=b;
const paid=r=>sum(r.payments||[],p=>p.v);
function rs(r){if(r.cancelado==="Sim")return"Cancelado";const p=paid(r);if(p>=r.valor-.005)return"Pago";if(r.prevista&&r.prevista<today())return"Atrasado";return p>0?"Parcialmente pago":"Pendente"}
function M(rg){const rv=S.revenues.filter(r=>r.cancelado!=="Sim"),ex=S.expenses;
 const fat=sum(rv.filter(r=>inR(r.venda,rg)),r=>r.valor),taxas=sum(rv.filter(r=>inR(r.venda,rg)),r=>r.taxa);
 const rec=sum(rv,r=>sum((r.payments||[]).filter(p=>inR(p.d,rg)),p=>p.v));
 const ep=ex.filter(e=>inR(e.data,rg)),dp=sum(ep.filter(e=>e.pago==="Pago"),e=>e.valor),dpe=sum(ep.filter(e=>e.pago!=="Pago"),e=>e.valor),dir=sum(ep.filter(e=>e.pago==="Pago"&&e.tipo==="Direto do serviço"),e=>e.valor);
 const aberto=sum(rv,r=>Math.max(0,r.valor-paid(r)));
 const saldo=sum(rv,r=>paid(r))-sum(ex.filter(e=>e.pago==="Pago"),e=>e.valor);
 return{fat,taxas,rec,dp,dpe,desp:dp+dpe,bruto:rec-dir,res:rec-dp,liq:fat-(dp+dpe)-taxas,aberto,saldo,cats:CATS.map(c=>[c,sum(ep.filter(e=>e.categoria===c),e=>e.valor)]).filter(x=>x[1]>0)}}
function mensal(){const y=new Date().getFullYear();return MES.map((l,i)=>{const rg=[`${y}-${String(i+1).padStart(2,"0")}-01`,`${y}-${String(i+1).padStart(2,"0")}-31`],m=M(rg);return{l,a:m.fat,b:m.desp,l2:m.liq}})}
/* ---------- gráficos (SVG) ---------- */
function bars(m){const mx=Math.max(1,...m.flatMap(x=>[x.a,x.b])),W=640,H=200,bw=W/12;

function sub(c,t,cb,err,single){let tm;const load=async()=>{let q=sb.from(t).select("*");if(single)q=q.eq("id",1);const{data,error}=await q;if(error)return err&&err(error);cb(data.map(r=>fromRow(c,r)))};load();
 sb.channel("rt-"+t).on("postgres_changes",{event:"*",schema:"public",table:t},()=>{clearTimeout(tm);tm=setTimeout(load,250)}).subscribe();return()=>{}}

 doc(id){return{
